[project]
name = "database"
version = "0.1.0"
dependencies = ["alembic", "sqlalchemy", "psycopg[binary]", "python-dotenv"]

# The lint floor, same as the api app: C901 at 10. `ctl check` fails a Python app without [tool.ruff].
[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "B", "C901"]
[tool.ruff.lint.mccabe]
max-complexity = 10
