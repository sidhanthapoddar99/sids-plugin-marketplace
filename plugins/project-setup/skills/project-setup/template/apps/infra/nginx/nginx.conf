# The production edge. One origin, path-routed. The vite proxy and next rewrites mirror this in dev.
#   /         → site:3000
#   /app/     → web:80
#   /api/     → api:8000       (+ websocket upgrade headers)
#   /engine/  → engine:8080    (+ websocket upgrade headers)
# Upstreams are compose service names: they are decided by compose.base.yaml, not by .env.
# TLS terminates here or at traefik. gzip on. client_max_body_size per route.
