# ${VAR} from .env, must be set. Literals are defaults; override them in config.local.yaml (gitignored).
database:
  url: ${DATABASE_URL}
  pool_size: 8
neo4j:
  url: ${NEO4J_URL}
  password: ${NEO4J_PASSWORD}
server:
  host: ${ENGINE_HOST}
  port: ${ENGINE_PORT}
  prefix: ${ENGINE_PREFIX}
auth:
  enabled: ${AUTH_ENABLED}   # TRUE or FALSE; FALSE is development sign-in, loopback only
  jwt_signing_key: ${JWT_SIGNING_KEY}
  encryption_key: ${ENCRYPTION_KEY_RUST}
