[workspace]
resolver = "2"
members = ["crates/common", "crates/data", "crates/auth", "crates/api"]

[workspace.package]
version = "0.1.0"
edition = "<version>"

# Dev and test builds (the test profile inherits dev): line numbers for this workspace's own crates,
# so a panic or a backtrace still names the file and line, and no debug info for dependencies. Each
# test binary is rewritten whole after an edit, and full debug info made most of it: on a measured
# Rust workspace, one edit wrote 4.3 GB instead of 15.1 GB, and a cold test build 7.6 GB instead of
# 25.1 GB. For a debugger session, CTL_RUST_DEBUG=full in the RUST section of .env restores full
# debug info for this workspace's crates in every build ctl starts. Leave CARGO_INCREMENTAL on: after a one-line edit, a test build took 15.7 s
# with it and 56 s without.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# Release builds, the ones production runs: full optimization, one codegen unit and fat LTO, so the
# compiler sees the whole program at once. The binary is faster and smaller; the price is a last
# build step that runs on one core, so only images and release builds pay it. Debug info is stripped
# and line tables stay in no shipped file.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

[workspace.dependencies]
# tokio, axum, sqlx (postgres, offline), neo4rs, serde, serde_yaml, figment, dotenvy, jsonwebtoken, tracing, thiserror, anyhow
