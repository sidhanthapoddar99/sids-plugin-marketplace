# Modifier. Publishes every app port to the host, each on its own _PORT from .env.proxy. Debug only.
# Never in prod. The edge takes the _PORT of the piece that owns /, as in compose.m.expose_web.yaml.
services:
  web:       { ports: ["${WEB_LANDING_PORT}:8080"] }
  dashboard: { ports: ["${DASHBOARD_PORT}:3000"] }
  api:       { ports: ["${API_PORT}:8000"] }
  engine:    { ports: ["${ENGINE_PORT}:8080"] }
