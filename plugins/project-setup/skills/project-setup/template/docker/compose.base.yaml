# Config `base`: the complete production stack, including engines and migration jobs.
# Ports are added only by modifiers. The dev preset selects just the data-core services.
# Each service declares its environment explicitly; source paths resolve from the project root.
x-defaults: &defaults
  restart: unless-stopped
  stop_grace_period: 35s                        # gunicorn --graceful-timeout 30 + margin
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

x-engine: &engine
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }
x-oneshot: &oneshot
  restart: "no"
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  api:
    <<: *defaults
    image: ${REGISTRY}/api:${TAG}
    build: { context: ./apps/example-api-python }
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
      API_HOST: 0.0.0.0
      API_PORT: 8000
      API_PREFIX: ${API_PREFIX}
      ENGINE_URL: http://engine:8080             # api calls engine by service name
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ENCRYPTION_KEY_PYTHON: ${ENCRYPTION_KEY_PYTHON}
      # PUBLIC_URL arrives only with +public (compose.m.public.yaml); absent = relative URLs only
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000${API_PREFIX}/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits: { memory: 1g, cpus: "2" }       # cpus sized with the gunicorn worker count
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  engine:
    <<: *defaults
    image: ${REGISTRY}/engine:${TAG}
    build: { context: ./apps/example-engine-rust }
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEO4J_URL: bolt://neo4j:7687
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      ENGINE_HOST: 0.0.0.0
      ENGINE_PORT: 8080
      ENGINE_PREFIX: ${ENGINE_PREFIX}
      JWT_SIGNING_KEY: ${JWT_SIGNING_KEY}
      ENCRYPTION_KEY_RUST: ${ENCRYPTION_KEY_RUST}
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080${ENGINE_PREFIX}/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 1g, cpus: "2" }
    depends_on:
      postgres: { condition: service_healthy }
      neo4j: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      neo4j-init: { condition: service_completed_successfully }

  # The edge. One nginx image holding every static frontend (apps/example-multi-web-app/*), proxying the rest.
  web:
    <<: *defaults
    stop_grace_period: 10s                      # nginx drains fast; no long requests terminate here
    image: ${REGISTRY}/web:${TAG}
    build:
      context: ./apps                           # needs packages/ too
      dockerfile: example-multi-web-app/Dockerfile
      args:                                     # build constants = the prefixes, from .env. No per-frontend .env.
        WEB_APP_PREFIX: ${WEB_APP_PREFIX}              #   app   — base of the SPA
        WEB_DOCS_PREFIX: ${WEB_DOCS_PREFIX}            #   docs  — base of the Astro site
        # landing owns / and needs no prefix arg
    environment:
      # prefixes: the operator's routing table, from .env
      WEB_APP_PREFIX: ${WEB_APP_PREFIX}
      WEB_DOCS_PREFIX: ${WEB_DOCS_PREFIX}
      DASHBOARD_PREFIX: ${DASHBOARD_PREFIX}
      API_PREFIX: ${API_PREFIX}
      ENGINE_PREFIX: ${ENGINE_PREFIX}
      # upstreams: compose decides the service names, so compose states them. +env_override swaps these.
      API_UPSTREAM: api:8000
      ENGINE_UPSTREAM: engine:8080
      DASHBOARD_UPSTREAM: dashboard:3000
      # only these names are substituted into the nginx template; nginx's own $host/$uri stay intact
      NGINX_ENVSUBST_FILTER: ^(WEB_APP_PREFIX|WEB_DOCS_PREFIX|DASHBOARD_PREFIX|API_PREFIX|ENGINE_PREFIX|API_UPSTREAM|ENGINE_UPSTREAM|DASHBOARD_UPSTREAM)$
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 5s
    deploy:
      resources:
        limits: { memory: 256m, cpus: "1" }
    depends_on:
      api: { condition: service_healthy }
      engine: { condition: service_healthy }
      dashboard: { condition: service_healthy }
    # ports come from a modifier: +expose_web (the / owner's _PORT, local) or +public (80/443).
    # The image listens on 8080, unprivileged.

  # Next.js SSR — needs a Node server, so its own image; the edge proxies ${DASHBOARD_PREFIX} to it.
  dashboard:
    <<: *defaults
    image: ${REGISTRY}/dashboard:${TAG}
    build:
      context: ./apps/example-dashboard-nextjs
      args:                                     # the prefix, from .env
        DASHBOARD_PREFIX: ${DASHBOARD_PREFIX}
    environment:                                # server side only
      API_HOST: api
      API_PORT: 8000
      # PUBLIC_URL arrives only with +public (compose.m.public.yaml); absent = relative URLs only
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:3000${DASHBOARD_PREFIX}/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    deploy:
      resources:
        limits: { memory: 512m, cpus: "1" }
    depends_on:
      api: { condition: service_healthy }

  postgres:
    <<: *engine
    image: pgvector/pgvector:<version>          # postgres + pgvector extension
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=C.UTF-8"   # or collation drifts between machines
    volumes:
      - "${DATA_DIR}/postgres/pgdata:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits: { memory: 2g }

  redis:
    <<: *engine
    image: redis:<version>
    command: ["redis-server", "/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}         # read by the healthcheck only
    volumes:
      - "${DATA_DIR}/redis:/data"
      - "./apps/database/redis/redis.conf:/etc/redis/redis.conf:ro"
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep -q PONG"]   # $$ escapes compose interpolation
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits: { memory: 512m }

  neo4j:
    <<: *engine
    image: neo4j:<version>
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}         # read by the healthcheck only
    volumes:
      - "${DATA_DIR}/neo4j:/data"
      - "./apps/database/neo4j:/init:ro"       # init.cypher applied by the neo4j-init one-shot below
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p $$NEO4J_PASSWORD 'RETURN 1' >/dev/null || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 40s                         # the JVM boots slowly
    deploy:
      resources:
        limits: { memory: 2g }

  # ── schema, one-shot ──
  migrate:
    <<: *oneshot
    image: ${REGISTRY}/migrate:${TAG}
    build: { context: ./apps/database/postgres }
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      postgres: { condition: service_healthy }

  neo4j-init:
    <<: *oneshot
    image: neo4j:<version>                      # same image as the engine: it ships cypher-shell
    environment:
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
    volumes:
      - "./apps/database/neo4j:/init:ro"
    entrypoint: ["sh", "-c", "cypher-shell -a bolt://neo4j:7687 -u neo4j -p \"$$NEO4J_PASSWORD\" -f /init/init.cypher"]
    depends_on:
      neo4j: { condition: service_healthy }
