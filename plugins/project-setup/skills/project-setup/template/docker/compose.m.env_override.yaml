# Modifier. Re-points services to values from .env instead of the compose service names.
# Use when one piece runs outside this compose (managed Postgres, remote engine).
# ctl refuses this modifier when a key it maps is blank in .env.
services:
  api:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
  engine:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URL: ${NEO4J_URL}
  site:
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
