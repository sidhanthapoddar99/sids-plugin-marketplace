# Modifier. Re-points services to values from .env instead of the compose service names.
# Use when one piece runs outside this compose (managed Postgres, remote engine, api on another server).
# ctl refuses this modifier when a key it maps is blank in .env.
services:
  web:
    environment:
      API_UPSTREAM: ${API_HOST}:${API_PORT}
      ENGINE_UPSTREAM: ${ENGINE_HOST}:${ENGINE_PORT}
      DASHBOARD_UPSTREAM: ${DASHBOARD_HOST}:${DASHBOARD_PORT}
  api:
    environment:
      ENGINE_URL: ${ENGINE_URL}
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
  engine:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      NEO4J_URL: ${NEO4J_URL}
  dashboard:
    environment:
      API_HOST: ${API_HOST}
      API_PORT: ${API_PORT}
