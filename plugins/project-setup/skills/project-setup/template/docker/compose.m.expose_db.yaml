# Modifier. Binds each engine to loopback on its _PORT from .env, so a process on the host
# (a dev server under `ctl dev`, psql, a debugger) reaches it. Loopback only: never the network.
# The dev preset selects engines and schema jobs from base with `--config base +expose_db --services postgres,redis,neo4j,migrate,neo4j-init`. Under `ctl up` the apps reach the engines by service name,
# so this modifier is not needed there.
services:
  postgres: { ports: ["127.0.0.1:${POSTGRES_PORT}:5432"] }
  redis:    { ports: ["127.0.0.1:${REDIS_PORT}:6379"] }
  neo4j:    { ports: ["127.0.0.1:${NEO4J_BOLT_PORT}:7687"] }
