# Modifier. Traefik as the edge in front of web instead of exposing it. Labels route by host.
# Use with `ctl up +traefik`, never together with +expose_web.
services:
  traefik:
    image: traefik:<version>
    command: ["--providers.docker=true", "--providers.file.filename=/dynamic.yaml"]
    ports: ["${HTTP_PORT}:80", "${HTTPS_PORT}:443"]
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock:ro"
      - "./apps/infra/traefik/dynamic.yaml:/dynamic.yaml:ro"
  web:
    labels:
      traefik.enable: "true"
      traefik.http.routers.web.rule: "Host(`${PUBLIC_HOST}`)"
      traefik.http.services.web.loadbalancer.server.port: "8080"
