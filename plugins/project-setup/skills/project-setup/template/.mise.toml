# Tool version contract. `mise install` sets up a clone. Never fill a version from memory.
[tools]
python = "<version>"
rust = "stable"
"cargo:cargo-watch" = "<version>"
go = "<version>"
bun = "latest"
uv = "latest"
jq = "<version>"             # Compose dependency selection and readiness contract
golangci-lint = "<version>"   # the Go lint floor: gofmt, go vet, gocyclo through .golangci.yml
# Add-on tools go here when the add-on is installed: lefthook for git hooks; gitleaks,
# cargo-audit and govulncheck for `ctl gate audit`. Per-app tools are pinned in the app's own manifest.

[env]
_.path = ["{{ config_root }}"]   # ctl runs bare
