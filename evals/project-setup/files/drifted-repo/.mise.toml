# Tool version contract. `mise install` sets up a clone. Never fill a version from memory.
[tools]
python = "3.13"
bun = "latest"
uv = "latest"
lefthook = "latest"
# repo-wide gate tools (ctl gate audit). Per-app tools are pinned in the app's own manifest.
gitleaks = "latest"

[env]
_.path = ["{{ config_root }}"]   # ctl runs bare
