# All settings of this service. ${VAR} comes from .env.secrets (keys, URLs) or .env.proxy (hosts, ports, prefixes) and must be set. Literals are defaults.
# A developer overrides literals in config.local.yaml (gitignored). Never a secret there: secrets stay ${VAR}.
database:
  url: ${DATABASE_URL}
  pool_size: 20
redis:
  url: ${REDIS_URL}
  session_ttl_seconds: 86400
server:
  host: ${API_HOST}
  port: ${API_PORT}
  prefix: ${API_PREFIX}
auth:
  jwt_signing_key: 8f2c41ab90de7715c0a3e6b4d92f1078
  encryption_key: ${ENCRYPTION_KEY_PYTHON}
  token_ttl_minutes: 60
limits:
  rate_per_minute: 120
log:
  level: info
