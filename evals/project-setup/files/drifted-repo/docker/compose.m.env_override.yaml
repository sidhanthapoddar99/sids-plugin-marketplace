# Modifier. Re-points services to values from .env.proxy (hosts, ports) and .env.secrets (URLs) instead of the compose service names.
# Use when one piece runs outside this compose (managed Postgres, remote engine, api on another server).
# ctl refuses this modifier when a key it maps is blank in those files.
services:
  web:
    environment:
      API_UPSTREAM: ${API_HOST}:${API_PORT}
  api:
    environment:
      DATABASE_URL: ${DATABASE_URL}
      REDIS_URL: ${REDIS_URL}
